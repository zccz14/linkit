name: publish-linkit-react-components

on:
  push:
    tags: ["linkit-react-components-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/linkit-react-components/package-lock.json
      - working-directory: packages/linkit-react-components
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run pack:check
          npm publish --access public
