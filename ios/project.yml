name: Linkit
options:
  bundleIdPrefix: io.ntnl
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Linkit:
    type: application
    platform: iOS
    sources:
      - path: Linkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ntnl.linkit
        PRODUCT_NAME: Linkit
        INFOPLIST_FILE: Linkit/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
  LinkitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LinkitTests
    dependencies:
      - target: Linkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ntnl.linkit.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Linkit:
    build:
      targets:
        Linkit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LinkitTests
