[package]
name = "linkit"
version = "0.1.19"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Auth Mini-powered profiles and messaging in one Rust binary"

[dependencies]
anyhow = "1"
async-stream = "0.3"
auth-mini-axum = "=0.1.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = "0.4"
dirs = "6"
futures-util = "0.3"
multer = "3"
rand = "0.9"
reqwest = "0.13"
ring = "0.17"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sysinfo = "0.38.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "net", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-full", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
