<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Profiles and instant messaging, powered by Auth Mini."
    />
    <script>
      // Linkit owns the dark mode preference (see linkit-react-components);
      // apply the mirrored preference before the first paint.
      (function () {
        try {
          var choice = localStorage.getItem("linkit.theme");
          var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/linkit-mark.svg" />
    <title>Linkit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
